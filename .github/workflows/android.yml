
name: Nova Browser APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/novabrowser
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "NovaBrowser"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.novabrowser'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.novabrowser'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="false"
                  android:label="Nova Browser"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="keyboardHidden|orientation|screenSize">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#8B9CFF</item>
                  <item name="android:statusBarColor">#101116</item>
                  <item name="android:navigationBarColor">#101116</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:windowActionModeOverlay">true</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/novabrowser/MainActivity.java <<'EOF'
          package com.novabrowser;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.view.Gravity;
          import android.view.KeyEvent;
          import android.view.View;
          import android.view.inputmethod.EditorInfo;
          import android.view.inputmethod.InputMethodManager;
          import android.content.Context;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;
          import java.io.ByteArrayInputStream;
          import java.net.URI;
          import java.util.Locale;

          public class MainActivity extends Activity {
              private final int bg = Color.rgb(16, 17, 22);
              private final int panel = Color.rgb(29, 31, 40);
              private final int accent = Color.rgb(139, 156, 255);
              private EditText address;
              private WebView web;
              private TextView status;
              private boolean blockerEnabled = true;

              private final String[] blockedHosts = {
                  "doubleclick.net",
                  "googlesyndication.com",
                  "googleadservices.com",
                  "adservice.google.com",
                  "adnxs.com",
                  "taboola.com",
                  "outbrain.com",
                  "popads.net",
                  "popcash.net",
                  "adsterra.com",
                  "scorecardresearch.com",
                  "adform.net",
                  "criteo.com",
                  "zedo.com"
              };

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().setStatusBarColor(bg);
                  getWindow().setNavigationBarColor(bg);
                  buildInterface();
                  setupWebView();
                  loadHome();
              }

              private GradientDrawable rounded(int color, int radius) {
                  GradientDrawable d = new GradientDrawable();
                  d.setColor(color);
                  d.setCornerRadius(radius);
                  return d;
              }

              private TextView text(String value, int size, int color) {
                  TextView t = new TextView(this);
                  t.setText(value);
                  t.setTextSize(size);
                  t.setTextColor(color);
                  t.setGravity(Gravity.CENTER);
                  return t;
              }

              private Button button(String value) {
                  Button b = new Button(this);
                  b.setText(value);
                  b.setTextSize(17);
                  b.setTextColor(Color.WHITE);
                  b.setAllCaps(false);
                  b.setMinWidth(0);
                  b.setMinimumWidth(0);
                  b.setPadding(3, 0, 3, 0);
                  b.setBackground(rounded(panel, 18));
                  return b;
              }

              private void buildInterface() {
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(bg);
                  root.setPadding(12, 8, 12, 4);

                  LinearLayout brandRow = new LinearLayout(this);
                  brandRow.setGravity(Gravity.CENTER_VERTICAL);
                  brandRow.setPadding(4, 2, 4, 8);

                  TextView logo = text("◉", 30, accent);
                  brandRow.addView(logo, new LinearLayout.LayoutParams(44, 48));

                  TextView title = text("Nova Browser", 21, Color.WHITE);
                  title.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  title.setGravity(Gravity.CENTER_VERTICAL | Gravity.LEFT);
                  brandRow.addView(title, new LinearLayout.LayoutParams(0, 48, 1));

                  Button shield = button("🛡");
                  shield.setOnClickListener(v -> {
                      blockerEnabled = !blockerEnabled;
                      Toast.makeText(this,
                          blockerEnabled ? "Reklam engelleme açık" :
                          "Reklam engelleme kapalı",
                          Toast.LENGTH_SHORT).show();
                      web.reload();
                  });
                  brandRow.addView(shield, new LinearLayout.LayoutParams(48, 44));
                  root.addView(brandRow);

                  address = new EditText(this);
                  address.setSingleLine(true);
                  address.setTextSize(15);
                  address.setTextColor(Color.WHITE);
                  address.setHintTextColor(Color.LTGRAY);
                  address.setHint("Ara veya web adresi yaz");
                  address.setPadding(16, 0, 12, 0);
                  address.setSelectAllOnFocus(true);
                  address.setImeOptions(EditorInfo.IME_ACTION_GO);
                  address.setBackground(rounded(panel, 24));

                  LinearLayout.LayoutParams addressParams =
                      new LinearLayout.LayoutParams(-1, 50);
                  addressParams.bottomMargin = 8;
                  root.addView(address, addressParams);

                  address.setOnEditorActionListener((v, actionId, event) -> {
                      if (actionId == EditorInfo.IME_ACTION_GO ||
                          (event != null && event.getKeyCode() == KeyEvent.KEYCODE_ENTER)) {
                          navigate(address.getText().toString());
                          ((InputMethodManager) getSystemService(
                              Context.INPUT_METHOD_SERVICE))
                              .hideSoftInputFromWindow(address.getWindowToken(), 0);
                          address.clearFocus();
                          return true;
                      }
                      return false;
                  });

                  LinearLayout controls = new LinearLayout(this);
                  controls.setGravity(Gravity.CENTER);
                  controls.setOrientation(LinearLayout.HORIZONTAL);

                  Button back = button("‹");
                  Button forward = button("›");
                  Button home = button("⌂");
                  Button reload = button("↻");
                  Button tabs = button("＋");

                  Button[] buttons = {back, forward, home, reload, tabs};
                  for (Button b : buttons) {
                      LinearLayout.LayoutParams p =
                          new LinearLayout.LayoutParams(0, 44, 1);
                      p.setMargins(3, 0, 3, 8);
                      controls.addView(b, p);
                  }

                  back.setOnClickListener(v -> {
                      if (web.canGoBack()) web.goBack();
                  });
                  forward.setOnClickListener(v -> {
                      if (web.canGoForward()) web.goForward();
                  });
                  home.setOnClickListener(v -> loadHome());
                  reload.setOnClickListener(v -> web.reload());
                  tabs.setOnClickListener(v -> loadHome());

                  root.addView(controls);

                  status = text("Reklam engelleme etkin", 11,
                      Color.rgb(165, 170, 190));
                  status.setGravity(Gravity.LEFT | Gravity.CENTER_VERTICAL);
                  status.setPadding(6, 0, 6, 5);
                  root.addView(status,
                      new LinearLayout.LayoutParams(-1, 24));

                  web = new WebView(this);
                  web.setBackgroundColor(bg);
                  root.addView(web,
                      new LinearLayout.LayoutParams(-1, 0, 1));

                  setContentView(root);
              }

              private void setupWebView() {
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setLoadWithOverviewMode(true);
                  s.setUseWideViewPort(true);
                  s.setSupportZoom(true);
                  s.setBuiltInZoomControls(true);
                  s.setDisplayZoomControls(false);
                  s.setJavaScriptCanOpenWindowsAutomatically(false);
                  s.setSupportMultipleWindows(false);
                  s.setMediaPlaybackRequiresUserGesture(true);

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(
                          WebView view, WebResourceRequest request) {
                          if (request.isForMainFrame()) {
                              String url = request.getUrl().toString();
                              if (url.startsWith("http://") ||
                                  url.startsWith("https://")) {
                                  return false;
                              }
                              return true;
                          }
                          return false;
                      }

                      @Override
                      public WebResourceResponse shouldInterceptRequest(
                          WebView view, WebResourceRequest request) {
                          if (blockerEnabled && isBlocked(
                              request.getUrl().getHost())) {
                              return new WebResourceResponse(
                                  "text/plain", "UTF-8",
                                  new ByteArrayInputStream(new byte[0]));
                          }
                          return super.shouldInterceptRequest(view, request);
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          if (!address.hasFocus()) address.setText(url);
                          status.setText(blockerEnabled
                              ? "🛡 Reklam engelleme açık"
                              : "Reklam engelleme kapalı");
                      }
                  });
              }

              private boolean isBlocked(String host) {
                  if (host == null) return false;
                  host = host.toLowerCase(Locale.ROOT);
                  for (String blocked : blockedHosts) {
                      if (host.equals(blocked) || host.endsWith("." + blocked)) {
                          return true;
                      }
                  }
                  return false;
              }

              private void navigate(String input) {
                  if (input == null || input.trim().isEmpty()) return;
                  String value = input.trim();
                  if (value.matches("^[a-zA-Z][a-zA-Z0-9+.-]*://.*")) {
                      web.loadUrl(value);
                  } else if (value.matches("^[^\\s]+\\.[^\\s]+$")) {
                      web.loadUrl("https://" + value);
                  } else {
                      try {
                          web.loadUrl("https://duckduckgo.com/?q=" +
                              java.net.URLEncoder.encode(value, "UTF-8"));
                      } catch (Exception e) {
                          web.loadUrl("https://duckduckgo.com/");
                      }
                  }
              }

              private void loadHome() {
                  address.setText("");
                  web.loadDataWithBaseURL(null,
                      "<html><meta name='viewport' content='width=device-width, initial-scale=1'>" +
                      "<body style='margin:0;background:#101116;color:white;" +
                      "font-family:sans-serif;text-align:center;padding:18vh 18px 0'>" +
                      "<div style='font-size:64px;color:#8b9cff'>◉</div>" +
                      "<h1>Nova Browser</h1>" +
                      "<p style='color:#a5aac0'>Hızlı, sade ve daha temiz gezinme</p>" +
                      "<p style='color:#8b9cff'>Adres çubuğuna arama veya web adresi yaz</p>" +
                      "</body></html>",
                      "text/html", "UTF-8", null);
              }

              @Override
              public void onBackPressed() {
                  if (web != null && web.canGoBack()) {
                      web.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (web != null) {
                      web.stopLoading();
                      web.destroy();
                  }
                  super.onDestroy();
              }
          }
          EOF

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaBrowser-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
