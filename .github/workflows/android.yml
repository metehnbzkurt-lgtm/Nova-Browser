name: Build Nova Browser APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract uploaded project zip
        run: |
          zipfile=$(find . -maxdepth 1 -iname "*.zip" | head -n 1)
          if [ -n "$zipfile" ]; then
            echo "Extracting $zipfile"
            unzip -o "$zipfile" -d .
          else
            echo "No zip file found at repo root, assuming project already extracted."
          fi
