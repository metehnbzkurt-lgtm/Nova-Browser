name: Build Nova Browser APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - name: Generate Android project files
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/novabrowser/app
          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "NovaBrowser"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.novabrowser.app"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.novabrowser.app"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:allowBackup="false" android:label="Nova Browser"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:usesCleartextTraffic="false">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:configChanges="keyboardHidden|orientation|screenSize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/novabrowser/app/MainActivity.kt <<'EOF'
          package com.novabrowser.app
          import android.annotation.SuppressLint
          import android.app.Activity
          import android.graphics.Color
          import android.os.Bundle
          import android.view.Gravity
          import android.view.inputmethod.EditorInfo
          import android.webkit.*
          import android.widget.*
          import java.io.ByteArrayInputStream
          import java.util.Locale

          class MainActivity : Activity() {
              private lateinit var web: WebView
              private lateinit var address: EditText
              private lateinit var shield: Button
              private lateinit var status: TextView
              private var shields = true
              private var blockedCount = 0
              private val home = "https://www.google.com"
              private val blockedHosts = setOf(
                  "doubleclick.net", "googlesyndication.com", "googleadservices.com",
                  "adservice.google.com", "adnxs.com", "adform.net", "taboola.com",
                  "outbrain.com", "scorecardresearch.com", "adcolony.com",
                  "app-measurement.com", "connect.facebook.net", "hotjar.com",
                  "mixpanel.com", "segment.io", "quantserve.com", "ads-twitter.com",
                  "ads.linkedin.com"
              )
              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.statusBarColor = Color.rgb(18,22,29)
                  window.navigationBarColor = Color.rgb(18,22,29)
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.rgb(18,22,29))
                  }
                  val top = LinearLayout(this).apply {
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(dp(12),dp(8),dp(8),dp(4))
                  }
                  top.addView(TextView(this).apply {
                      text = "◈  NOVA"; textSize = 19f; setTextColor(Color.WHITE)
                  }, LinearLayout.LayoutParams(0,dp(42),1f))
                  shield = Button(this).apply {
                      isAllCaps = false; setTextColor(Color.WHITE)
                      setOnClickListener {
                          shields = !shields
                          updateShield()
                          Toast.makeText(this@MainActivity,
                              if (shields) "Kalkan açık" else "Kalkan kapalı", Toast.LENGTH_SHORT).show()
                          web.reload()
                      }
                  }
                  top.addView(shield); root.addView(top)
                  val row = LinearLayout(this).apply {
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(dp(8),dp(2),dp(8),dp(8))
                  }
                  address = EditText(this).apply {
                      hint = "Ara veya adres yaz"; singleLine = true; textSize = 15f
                      setTextColor(Color.WHITE); setHintTextColor(Color.LTGRAY)
                      imeOptions = EditorInfo.IME_ACTION_GO
                      setOnEditorActionListener { _, action, _ ->
                          if (action == EditorInfo.IME_ACTION_GO || action == EditorInfo.IME_ACTION_DONE) {
                              navigate(text.toString()); true
                          } else false
                      }
                  }
                  row.addView(address, LinearLayout.LayoutParams(0,dp(48),1f))
                  row.addView(Button(this).apply {
                      text = "Git"; isAllCaps = false
                      setOnClickListener { navigate(address.text.toString()) }
                  }); root.addView(row)
                  web = WebView(this)
                  web.settings.apply {
                      javaScriptEnabled = true; domStorageEnabled = true
                      loadsImagesAutomatically = true; builtInZoomControls = true
                      displayZoomControls = false; javaScriptCanOpenWindowsAutomatically = false
                      setSupportMultipleWindows(false)
                      mixedContentMode = WebSettings.MIXED_CONTENT_NEVER_ALLOW
                      allowFileAccess = false; allowContentAccess = false
                  }
                  CookieManager.getInstance().setAcceptThirdPartyCookies(web,false)
                  web.webChromeClient = object : WebChromeClient() {
                      override fun onProgressChanged(view: WebView?, progress: Int) {
                          status.text = "Kalkan • $blockedCount engellendi • $progress%"
                      }
                  }
                  web.webViewClient = object : WebViewClient() {
                      override fun shouldInterceptRequest(view: WebView?, request: WebResourceRequest?): WebResourceResponse? {
                          val host = request?.url?.host?.lowercase(Locale.ROOT) ?: return null
                          if (shields && blockedHosts.any { host == it || host.endsWith(".$it") }) {
                              synchronized(this@MainActivity) { blockedCount++ }
                              return WebResourceResponse("text/plain","utf-8",204,"No Content",
                                  mapOf("Access-Control-Allow-Origin" to "*"),ByteArrayInputStream(ByteArray(0)))
                          }
                          return null
                      }
                      override fun onPageStarted(view: WebView?, url: String?, favicon: android.graphics.Bitmap?) {
                          if (url != null) address.setText(url)
                          blockedCount = 0; status.text = "Sayfa yükleniyor…"
                      }
                      override fun onPageFinished(view: WebView?, url: String?) {
                          if (url != null) address.setText(url)
                          status.text = "Kalkan • $blockedCount engellendi"
                      }
                  }
                  root.addView(web,LinearLayout.LayoutParams(-1,0,1f))
                  val bottom = LinearLayout(this).apply {
                      gravity = Gravity.CENTER; setBackgroundColor(Color.rgb(25,30,39))
                  }
                  fun nav(label: String, action: () -> Unit) {
                      bottom.addView(Button(this).apply {
                          text = label; isAllCaps = false; setTextColor(Color.WHITE)
                          setOnClickListener { action() }
                      },LinearLayout.LayoutParams(0,dp(48),1f))
                  }
                  nav("Geri") { if (web.canGoBack()) web.goBack() }
                  nav("Ana sayfa") { web.loadUrl(home) }
                  nav("İleri") { if (web.canGoForward()) web.goForward() }
                  nav("Yenile") { web.reload() }
                  root.addView(bottom)
                  status = TextView(this).apply {
                      textSize = 11f; setTextColor(Color.LTGRAY)
                      setPadding(dp(12),dp(5),dp(12),dp(6))
                      setBackgroundColor(Color.rgb(25,30,39))
                  }
                  root.addView(status); setContentView(root); updateShield(); web.loadUrl(home)
              }
              private fun updateShield() {
                  shield.text = if (shields) "🛡 Kalkan açık" else "Kalkan kapalı"
                  shield.setBackgroundTintList(android.content.res.ColorStateList.valueOf(
                      if (shields) Color.rgb(37,110,83) else Color.rgb(90,68,45)))
              }
              private fun navigate(raw: String) {
                  val s = raw.trim(); if (s.isEmpty()) return
                  val url = if (s.contains(" ") || (!s.contains(".") && !s.startsWith("http")))
                      "https://www.google.com/search?q=" + java.net.URLEncoder.encode(s,"UTF-8")
                  else if (s.startsWith("https://") || s.startsWith("http://")) s else "https://$s"
                  web.loadUrl(url)
              }
              private fun dp(n: Int) = (n * resources.displayMetrics.density).toInt()
              @Deprecated("Deprecated in Android")
              override fun onBackPressed() {
                  if (::web.isInitialized && web.canGoBack()) web.goBack() else super.onBackPressed()
              }
              override fun onDestroy() {
                  if (::web.isInitialized) { web.stopLoading(); web.destroy() }
                  super.onDestroy()
              }
          }
          EOF
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: NovaBrowser-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
